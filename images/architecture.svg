<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .box-title { font-weight: 700; font-size: 15px; fill: #FFFFFF; }
      .box-sub { font-size: 12px; fill: #9E9E9E; }
      .arrow-text { font-size: 11px; font-weight: 600; fill: #64B5F6; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64B5F6" />
    </marker>
  </defs>

  <rect width="880" height="260" rx="14" fill="#0D1117" />

  <!-- Node 1: Somat Hardware -->
  <g transform="translate(30, 40)">
    <rect width="220" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#00695C" />
    <path d="M 28 26 L 40 26 L 37 42 L 31 42 Z" fill="#FFFFFF" />
    <text x="62" y="32" class="font box-title">Somat Smartwash</text>
    <text x="62" y="48" class="font box-sub">Battery IoT Unit</text>

    <text x="16" y="86" class="font box-sub">• Ultrasonic dosing</text>
    <text x="16" y="108" class="font box-sub">• Internal sensors (turbidity, fill)</text>
    <text x="16" y="130" class="font box-sub">• Wi-Fi (deep sleep / wake cycles)</text>
    <text x="16" y="152" class="font box-sub">• ESP/Nordic architecture</text>
  </g>

  <!-- Connection Line 1 -> 2 -->
  <line x1="250" y1="130" x2="320" y2="130" stroke="#64B5F6" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="285" y="118" class="font arrow-text">MQTT / TLS</text>
  <text x="285" y="148" class="font arrow-text">Telemetry</text>

  <!-- Node 2: Henkel Cloud -->
  <g transform="translate(330, 40)">
    <rect width="230" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#1565C0" />
    <circle cx="34" cy="34" r="8" fill="#FFFFFF" />
    <text x="62" y="32" class="font box-title">Henkel Cloud API</text>
    <text x="62" y="48" class="font box-sub">app-api.somat-smartwash.com</text>

    <text x="16" y="86" class="font box-sub">• GraphQL Engine (UUID entity)</text>
    <text x="16" y="108" class="font box-sub">• SAP Gigya CDC OIDC Auth</text>
    <text x="16" y="130" class="font box-sub">• Device State Shadow</text>
    <text x="16" y="152" class="font box-sub">• Historical wash cycle analytics</text>
  </g>

  <!-- Connection Line 2 -> 3 -->
  <line x1="560" y1="130" x2="630" y2="130" stroke="#64B5F6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="595" y="118" class="font arrow-text">GraphQL</text>
  <text x="595" y="148" class="font arrow-text">JWT Bearer</text>

  <!-- Node 3: Home Assistant -->
  <g transform="translate(640, 40)">
    <rect width="210" height="180" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
    <rect x="16" y="16" width="36" height="36" rx="8" fill="#0288D1" />
    <path d="M 24 38 L 44 38 L 44 30 L 34 22 L 24 30 Z" fill="#FFFFFF" />
    <text x="62" y="32" class="font box-title">Home Assistant</text>
    <text x="62" y="48" class="font box-sub">Custom Component</text>

    <text x="16" y="86" class="font box-sub">• Sensors (Fill %, RSSI, Status)</text>
    <text x="16" y="108" class="font box-sub">• Binary Sensors (Battery, Refill)</text>
    <text x="16" y="130" class="font box-sub">• Program Selector (Intensiv/Eco)</text>
    <text x="16" y="152" class="font box-sub">• Automations &amp; Notifications</text>
  </g>
</svg>
